name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Publish NativeMonitor
        run: |
          dotnet publish src/NativeMonitor/NativeMonitor.csproj -c Release -r win-x64 --self-contained false -o dist/Win11TaskbarMonitor-App

      - name: Build Release Package
        shell: pwsh
        run: |
          ./scripts/Build-ReleasePackage.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Win11TaskbarMonitor-Setup.zip
          draft: false
          prerelease: false
          generate_release_notes: true
