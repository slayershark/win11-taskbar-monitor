<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Solid, crisp palettes adhering to Windows 11 Fluent Design System -->
  </defs>
  <g id="telemetry-w-mark">
    <!-- Pillar 1: CPU Compute Stream -->
    <rect x="130" y="148" width="36" height="196" rx="18" fill="#38BDF8" />
    
    <!-- Pillar 2: GPU Render Stream (Valley) -->
    <rect x="202" y="228" width="36" height="116" rx="18" fill="#0EA5E9" />
    
    <!-- Pillar 3: Thermal Pulse (Peak) -->
    <rect x="274" y="124" width="36" height="220" rx="18" fill="#0284C7" />
    
    <!-- Pillar 4: Physical Memory Stream -->
    <rect x="346" y="180" width="36" height="164" rx="18" fill="#38BDF8" />
    
    <!-- Taskbar Anchor Datum Base -->
    <rect x="106" y="376" width="300" height="28" rx="14" fill="#0284C7" />
  </g>
</svg>
